plugins {
    id 'java'
    id 'maven-publish'
    id 'com.enonic.xp.base'
    id 'com.enonic.defaults' version '2.1.7'
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo('dev')
}

dependencies {
    compileOnly xplibs.api.script
    implementation libs.zxing.core

    testImplementation libs.junit.jupiter
    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly libs.graalvm.js
}

test {
    useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'xp.script-engine', 'GraalJS'
    shouldRunAfter test
}

check.dependsOn testGraalJs

artifacts {
    archives jar
}
